site_name: MetaSheet-Guard
site_description: Experimental-design-aware quality control, repair, and workflow export for sequencing analysis sample sheets.
site_url: https://qchiujunhao.github.io/metasheet-guard/
repo_url: https://github.com/qchiujunhao/metasheet-guard
repo_name: qchiujunhao/metasheet-guard
theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: teal
      accent: amber
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Schemas: schemas.md
  - Validator rules: validators.md
  - Repair: repair.md
  - Exporters: exporters.md
  - Reports: reports.md
  - API: api.md
  - Related tools: related_tools.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
copyright: Copyright &copy; 2026 MetaSheet-Guard contributors
